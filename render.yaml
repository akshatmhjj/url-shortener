services:
  - type: web
    name: url-shortener-api
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: JWT_SECRET
        generateValue: true

      - key: CORS_ORIGIN
        value: https://your-project-name.vercel.app

      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: url-shortener-redis
          property: connectionString

      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: keyvalue
    name: url-shortener-redis
    plan: free
    ipAllowList: []

databases:
  - name: url-shortener-db
    databaseName: url_shortener
    user: postgres
    plan: free
    ipAllowList: []